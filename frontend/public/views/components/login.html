<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/public/css/components/style-login.css">
    <link rel="stylesheet" href="/frontend/public/css/variables.css">
</head>
<body>  
    <div class="login-container">

        <a href="/frontend/public/views/index.html" class="back-to-login">
         ← Volver al inicio
        </a>
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
            <p>No tienes una cuenta? <a href="/frontend/public/views/components/register.html">Crear una cuenta</a></p>
            <div id="mensaje" class="mensaje"></div>
        </form>
    </div>
    <script src="/frontend/public/js/components/script.js"></script>
</body>
</html>
